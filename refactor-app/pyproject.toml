[project]
name = "refactor-app"
version = "0.1.0"
description = "Independent refactor target app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.0,<4.0",
  "httpx>=0.27,<1.0",
  "requests>=2.32,<3.0",
  "curl_cffi>=0.15,<1.0",
  "camoufox[geoip]>=0.5,<0.6",
  "playwright==1.60.0",
  "loguru>=0.7,<1.0",
  "python-json-logger>=2.0,<4.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "cloakbrowser[geoip]>=0.5.7,<0.6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
]
test = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "respx>=0.21,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/refactor_app/plugins/openai_auth_protocol/*.py" = ["E", "F", "I", "UP", "B"]
"src/refactor_app/plugins/paypal_agreement_protocol/*.py" = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
"refactor_app.plugins.openai_auth_browser" = [
  "personal_checkout_create.js",
  "personal_payment_method_form.js",
  "personal_plus_checkout.js",
  "personal_plus_checkout_oaics.js",
]
"refactor_app.plugins.paypal_agreement_protocol" = [
  "data/paypal_supported_countries.json",
]
