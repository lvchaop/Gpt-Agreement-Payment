[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invite-executor"
version = "0.7.0"
description = "Pinned batch executor with isolated per-space automatic replenishment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "curl-cffi>=0.15,<1.0",
  "refactor-app==0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
invite-executor = "invite_executor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invite_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
