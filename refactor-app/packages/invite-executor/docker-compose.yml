services:
  invite-executor:
    build:
      context: ../..
      dockerfile: packages/invite-executor/Dockerfile
    image: invite-executor:local
    init: true
    restart: unless-stopped
    environment:
      INVITE_EXECUTOR_API_KEY: ${INVITE_EXECUTOR_API_KEY:?INVITE_EXECUTOR_API_KEY is required}
      INVITE_EXECUTOR_MAX_BATCH_SIZE: ${INVITE_EXECUTOR_MAX_BATCH_SIZE:-1000}
      INVITE_EXECUTOR_BARRIER_TIMEOUT_S: ${INVITE_EXECUTOR_BARRIER_TIMEOUT_S:-30}
      INVITE_EXECUTOR_SESSION_OTP_BARRIER_TIMEOUT_S: ${INVITE_EXECUTOR_SESSION_OTP_BARRIER_TIMEOUT_S:-120}
      INVITE_EXECUTOR_SESSION_OTP_RELEASE_WINDOW_S: ${INVITE_EXECUTOR_SESSION_OTP_RELEASE_WINDOW_S:-2}
      INVITE_EXECUTOR_REQUEST_TIMEOUT_S: ${INVITE_EXECUTOR_REQUEST_TIMEOUT_S:-30}
      INVITE_EXECUTOR_PREWARM_ROUNDS: ${INVITE_EXECUTOR_PREWARM_ROUNDS:-1}
      INVITE_EXECUTOR_PREWARM_ATTEMPTS: ${INVITE_EXECUTOR_PREWARM_ATTEMPTS:-10}
      INVITE_EXECUTOR_PREWARM_START_INTERVAL_MS: ${INVITE_EXECUTOR_PREWARM_START_INTERVAL_MS:-20}
      INVITE_EXECUTOR_PREWARM_KEEPALIVE_INTERVAL_S: ${INVITE_EXECUTOR_PREWARM_KEEPALIVE_INTERVAL_S:-5}
      INVITE_EXECUTOR_PREWARM_TIMEOUT_S: ${INVITE_EXECUTOR_PREWARM_TIMEOUT_S:-5}
      INVITE_EXECUTOR_RESULT_TTL_S: ${INVITE_EXECUTOR_RESULT_TTL_S:-3600}
      INVITE_EXECUTOR_STATIC_PROXY_GATEWAY_HOST: ${INVITE_EXECUTOR_STATIC_PROXY_GATEWAY_HOST:-p.webshare.io}
      INVITE_EXECUTOR_STATIC_PROXY_GATEWAY_PORT: ${INVITE_EXECUTOR_STATIC_PROXY_GATEWAY_PORT:-80}
      INVITE_EXECUTOR_STATIC_PROXY_USERNAME: ${INVITE_EXECUTOR_STATIC_PROXY_USERNAME:?INVITE_EXECUTOR_STATIC_PROXY_USERNAME is required}
      INVITE_EXECUTOR_STATIC_PROXY_PASSWORD: ${INVITE_EXECUTOR_STATIC_PROXY_PASSWORD:?INVITE_EXECUTOR_STATIC_PROXY_PASSWORD is required}
      INVITE_EXECUTOR_STATIC_PROXY_COUNTRY: ${INVITE_EXECUTOR_STATIC_PROXY_COUNTRY:-US}
      INVITE_EXECUTOR_INVITE_PROXY_COUNT: ${INVITE_EXECUTOR_INVITE_PROXY_COUNT:-1000}
      INVITE_EXECUTOR_INVITES_PER_PROXY: ${INVITE_EXECUTOR_INVITES_PER_PROXY:-1}
      INVITE_EXECUTOR_AUTO_REPLENISH_ENABLED: ${INVITE_EXECUTOR_AUTO_REPLENISH_ENABLED:-false}
      INVITE_EXECUTOR_AUTO_REPLENISH_INTERVAL_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_INTERVAL_S:-120}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAX_WORKERS: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAX_WORKERS:-20}
      INVITE_EXECUTOR_AUTO_REPLENISH_REGISTRY_PATH: ${INVITE_EXECUTOR_AUTO_REPLENISH_REGISTRY_PATH:-/data/replenishment-registry.json}
      INVITE_EXECUTOR_AUTO_REPLENISH_ACCOUNT_PROXY_COUNT: ${INVITE_EXECUTOR_AUTO_REPLENISH_ACCOUNT_PROXY_COUNT:-1000}
      INVITE_EXECUTOR_AUTO_REPLENISH_ACCOUNT_PROXY_COUNTRY: ${INVITE_EXECUTOR_AUTO_REPLENISH_ACCOUNT_PROXY_COUNTRY:-JP}
      INVITE_EXECUTOR_AUTO_REPLENISH_USAGE_THRESHOLD_PERCENT: ${INVITE_EXECUTOR_AUTO_REPLENISH_USAGE_THRESHOLD_PERCENT:-90}
      INVITE_EXECUTOR_AUTO_REPLENISH_USAGE_STALE_AFTER_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_USAGE_STALE_AFTER_S:-7200}
      INVITE_EXECUTOR_AUTO_REPLENISH_MEMBER_CONFIRM_ATTEMPTS: ${INVITE_EXECUTOR_AUTO_REPLENISH_MEMBER_CONFIRM_ATTEMPTS:-3}
      INVITE_EXECUTOR_AUTO_REPLENISH_MEMBER_CONFIRM_INTERVAL_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_MEMBER_CONFIRM_INTERVAL_S:-2}
      INVITE_EXECUTOR_AUTO_REPLENISH_CANDIDATE_FAILURE_COOLDOWN_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_CANDIDATE_FAILURE_COOLDOWN_S:-600}
      INVITE_EXECUTOR_AUTO_REPLENISH_BROWSER_HEADLESS: ${INVITE_EXECUTOR_AUTO_REPLENISH_BROWSER_HEADLESS:-true}
      INVITE_EXECUTOR_AUTO_REPLENISH_BROWSER_OTP_TIMEOUT_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_BROWSER_OTP_TIMEOUT_S:-180}
      INVITE_EXECUTOR_AUTO_REPLENISH_CODEX_TIMEOUT_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_CODEX_TIMEOUT_S:-240}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_API_KEY: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_API_KEY:-}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_BASE_URL: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_BASE_URL:-https://api.grizzlysms.com/stubs/handler_api.php}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_SERVICE: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_SERVICE:-dr}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_COUNTRY: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_COUNTRY:-187}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_MAX_PRICE: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_MAX_PRICE:-0.18}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_MAX_NUMBER_ATTEMPTS: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_MAX_NUMBER_ATTEMPTS:-3}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_REQUEST_TIMEOUT_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_REQUEST_TIMEOUT_S:-20}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_OTP_TIMEOUT_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_OTP_TIMEOUT_S:-120}
      INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_POLL_INTERVAL_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_GRIZZLY_SMS_POLL_INTERVAL_S:-3}
      INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_BASE_URL: ${INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_BASE_URL:-}
      INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_API_KEY: ${INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_API_KEY:-}
      INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_API_KEY_HEADER: ${INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_API_KEY_HEADER:-x-api-key}
      INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_GROUP_ID: ${INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_GROUP_ID:-0}
      INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_GROUP_IDS: ${INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_GROUP_IDS:-}
      INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_TIMEOUT_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_SUB2API_TIMEOUT_S:-30}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_BASE_URL: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_BASE_URL:-}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_API_KEY: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_API_KEY:-}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_API_KEY_HEADER: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_API_KEY_HEADER:-X-API-Key}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_PROVIDER_NAME: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_PROVIDER_NAME:-outlook}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_TIMEOUT_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_TIMEOUT_S:-30}
      INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_POLL_INTERVAL_S: ${INVITE_EXECUTOR_AUTO_REPLENISH_MAIL_POLL_INTERVAL_S:-3}
      OTP_TIMEOUT: ${OTP_TIMEOUT:-180}
      REFACTOR_APP_BROWSER_IMPERSONATE: ${REFACTOR_APP_BROWSER_IMPERSONATE:-chrome142}
    ports:
      - "${INVITE_EXECUTOR_PUBLIC_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${INVITE_EXECUTOR_DATA_DIR:-/opt/invite-executor/data}
        target: /data
        bind:
          create_host_path: false
    pids_limit: 4096
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
      nproc:
        soft: 4096
        hard: 4096
