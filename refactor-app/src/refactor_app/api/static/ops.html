<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>refactor-app ops</title>
    <style>
      body { color: #172033; font-family: system-ui, sans-serif; margin: 24px; }
      button, input, textarea { font: inherit; }
      button { background: #1f5eff; border: 0; border-radius: 6px; color: white; cursor: pointer; margin: 4px; padding: 8px 12px; }
      input, textarea { border: 1px solid #c8d0df; border-radius: 6px; margin: 4px; padding: 8px; }
      textarea { min-height: 92px; min-width: 560px; vertical-align: top; }
      section { border: 1px solid #d7dde8; border-radius: 8px; margin: 16px 0; padding: 14px; }
      pre { background: #f5f7fb; border-radius: 6px; overflow: auto; padding: 12px; }
      .muted { color: #647089; }
    </style>
  </head>
  <body>
    <header>
      <h1>refactor-app 运维台</h1>
      <p class="muted">只保留 Space 口径入口；旧 workspace / codex credential / batch / remote release 入口不在此页出现。</p>
    </header>

    <section>
      <h2>快捷查看</h2>
      <button data-load="/jobs">Job 列表</button>
      <button data-load="/user-accounts">User Account</button>
      <button data-load="/spaces">Spaces</button>
      <button data-load="/space-credentials">Space Credentials</button>
      <button data-load="/memberships">Space Memberships</button>
      <button data-load="/downstream-channels">Downstream Channels</button>
      <button data-load="/automation/schedules">Automation Schedules</button>
    </section>

    <section>
      <h2>Job / Run 详情</h2>
      <input id="jobId" placeholder="job_id" />
      <button onclick="loadPath('/jobs/' + valueOf('jobId'))">查看 Job</button>
      <button onclick="loadPath('/jobs/' + valueOf('jobId') + '/runs')">查看 JobRun</button>
      <button onclick="loadPath('/jobs/' + valueOf('jobId') + '/work-items')">查看 Work Items</button>
      <input id="runId" placeholder="run_id" />
      <button onclick="loadPath('/runs/' + valueOf('runId') + '/steps')">Step timeline</button>
      <button onclick="loadPath('/runs/' + valueOf('runId') + '/events')">Event log</button>
    </section>

    <section>
      <h2>Space Job</h2>
      <textarea id="pushPendingPayload">{"downstream_channel_id":"","created_by":"ops","work_count":1}</textarea>
      <button onclick="postJson('/space-credentials/push-pending-job', 'pushPendingPayload')">按下游余额补推</button>
      <textarea id="recyclePayload">{"limit":100,"created_by":"ops"}</textarea>
      <button onclick="postJson('/spaces/recycle-sweep-job', 'recyclePayload')">Space 回收扫描</button>
    </section>

    <section>
      <h2>结果</h2>
      <div id="resultMeta" class="muted"></div>
      <div id="result"></div>
    </section>

    <script>
      function valueOf(id) {
        return encodeURIComponent(document.getElementById(id).value.trim());
      }
      function render(data) {
        document.getElementById("resultMeta").textContent = new Date().toISOString();
        document.getElementById("result").innerHTML = "<pre>" + escapeHtml(JSON.stringify(data, null, 2)) + "</pre>";
      }
      async function loadPath(path) {
        const response = await fetch(path);
        render(await response.json());
      }
      async function postJson(path, textareaId) {
        const payload = JSON.parse(document.getElementById(textareaId).value);
        const response = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
        render(await response.json());
      }
      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
      document.querySelectorAll("[data-load]").forEach((button) => {
        button.addEventListener("click", () => loadPath(button.getAttribute("data-load")));
      });
    </script>
  </body>
</html>
